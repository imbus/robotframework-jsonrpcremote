name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      # python-version sets UV_PYTHON, which every later uv command uses instead of .python-version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # The unit tests import the server package and the robot suites spawn it,
      # but uv sync/run target only the workspace root by default -- so operate on
      # all workspace members. (--all-packages is needed on `uv run` too, since it
      # re-syncs exactly by default and would otherwise prune the extra members.)
      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Unit tests
        run: uv run --all-packages pytest

      # paths, output-dir and the Windows-only exclude come from robot.toml.
      - name: Robot integration tests
        run: uv run --all-packages robotcode run

      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results-${{ matrix.os }}-${{ matrix.python }}
          path: results/

  test-robot-framework-minimum:
    name: test (${{ matrix.os }}, Robot Framework minimum)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Must match the robotframework>= requirement in pyproject.toml and packages/server/pyproject.toml.
      ROBOT_FRAMEWORK_MINIMUM: "7.2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Without python-version: the Python from .python-version, the minimum.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-packages

      # --with layers the minimum over the locked version, also for the servers the suites start.
      - name: Unit tests
        run: uv run --all-packages --with "robotframework==${{ env.ROBOT_FRAMEWORK_MINIMUM }}" pytest

      - name: Robot integration tests
        run: uv run --all-packages --with "robotframework==${{ env.ROBOT_FRAMEWORK_MINIMUM }}" robotcode run

      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results-${{ matrix.os }}-robot-framework-minimum
          path: results/
