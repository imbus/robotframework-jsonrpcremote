schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  Follow the repository guidelines in AGENTS.md. English is the project
  language: write every artifact in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  tasks:
    - Name in each task the unit tests (pytest, tests/) and the Robot Framework tests (atests/) that verify it, and cover every spec scenario with at least one of them.
    - Add or change a Robot test when the changed behavior can be observed from Robot Framework, such as keyword calls with their arguments and results, log messages, execution errors, the library import, Libdoc or the output files. When such a task adds none, state why.
    - Run the unit tests and all Robot suites in the integration checks, also when the change adds no Robot test.
    - Run each new test against the code without the part of the change it covers and see it fail there; failing against the unchanged code alone does not show which part a test covers.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
