paths = ["atests"]
output-dir = "results"
default-profiles = ["windows", "non_windows"]
#log-level = "TRACE"

# Tests of POSIX signals such as SIGTERM carry the tag posix: on Windows, terminate() is a hard kill.
# The tag windows is for tests that only hold on Windows.
[profiles.windows]
enabled.if = "platform.system() == 'Windows'"
excludes = ["posix"]

[profiles.non_windows]
enabled.if = "platform.system() != 'Windows'"
excludes = ["windows"]
